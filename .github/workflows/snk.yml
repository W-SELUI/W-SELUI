name: generate bomberman animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Bomberman SVGs
        run: |
          mkdir -p dist
          npx pacman-contribution-graph --game bomberman --platform github --username W-SELUI --gameTheme github --output dist/bomberman-contribution-graph.svg
          npx pacman-contribution-graph --game bomberman --platform github --username W-SELUI --gameTheme github-dark --output dist/bomberman-contribution-graph-dark.svg

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
